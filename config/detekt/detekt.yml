# The ktlint-wrapper plugin (dev.detekt:detekt-rules-ktlint-wrapper) has been on the detektPlugins
# classpath the whole time, but with no ktlint: block here the whole ruleset was completely inert
# (a ruleset needs an explicit `active: true` block to run at all, same as every other ruleset in
# this file) - a real gap, not a deliberate choice. Enabling it now with its ~84 default-active
# formatting rules. This is a large, previously-unformatted-to-ktlint codebase, so the baseline
# (config/detekt/baseline/*.xml, regenerated via `./gradlew detektBaseline`) grandfathers the
# existing style debt rather than forcing a repo-wide reformatting diff in this pass - it still
# enforces ktlint style on any NEW code going forward.
ktlint:
  active: true
  # Lets `detekt` rewrite formatting findings when the Gradle task runs with autoCorrect=true
  # (off by default, so a normal `detekt` run is still check-only).
  autoCorrect: true
  # Empirically confirmed (unlike detekt's own first-party rule sets) that a bare `active: true`
  # at the ruleset level does NOT cascade compiled-in per-rule defaults for this third-party
  # ruleset - every rule needs its own explicit active: true/false, or it silently does nothing.
  # This enumerates every rule Detekt 2.0's ktlint-wrapper documents as "active by default";
  # the handful documented as inactive by default are left out (same net effect as false).
  AnnotationOnSeparateLine:
    active: true
  AnnotationSpacing:
    active: true
  ArgumentListWrapping:
    active: true
  BackingPropertyNaming:
    active: true
  BinaryExpressionWrapping:
    active: true
  BlockCommentInitialStarAlignment:
    active: true
  ChainWrapping:
    active: true
  ClassSignature:
    active: true
  CommentSpacing:
