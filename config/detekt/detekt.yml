Compose:
  # Rule-ID correction: these 5 entries were configured under stale/incorrect names inherited
  # from the old com.twitter.compose.rules fork's docs and were silently dead config the entire
  # time (confirmed empirically - detekt does not validate unknown property names within a
  # third-party ruleset section, unlike a top-level ruleset ID or a first-party ruleset's rule
  # names, both of which fail hard on a typo). Real IDs verified against the actual
  # io.nlopez.compose.rules:detekt:0.4.23 jar's class list, not inferred from docs.
  CompositionLocalAllowlist:
    active: false
    # You can optionally define a list of CompositionLocals that are allowed here
    # allowedCompositionLocals: LocalSomething,LocalSomethingElse
  CompositionLocalNaming:
    active: true
  ContentEmitterReturningValues:
    active: true
    # You can optionally add your own composables here
    # contentEmitters: MyComposable,MyOtherComposable
  # Found 2 real hits in GlassModifiers.kt (glassEffect/glassScrim), both legitimately reading
  # composition-scoped values (GlassTheme.backdrop, rememberLayerBackdrop()) inside a widely-used
  # public API. Migrating to Modifier.Node is a genuine architectural rewrite with real regression
  # risk for a core glass-effects utility - left disabled pending a deliberate decision, not fixed
  # blindly in this pass. Same disposal as ViewModelForwarding above.
  ModifierComposed: # was: ModifierComposable (dead config)
    active: false
  ModifierMissing:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleContentEmitters: # was: MultipleEmitters (dead config)
    active: true
    # You can optionally add your own composables here
    # contentEmitters: MyComposable,MyOtherComposable
  MutableParameters: # was: MutableParams (dead config)
    active: true
  ComposableNaming:
    active: true
    # You can optionally disable the checks in this rule for regex matches against the composable name (e.g. molecule presenters)
    # allowedComposableFunctionNames: .*Presenter,.*MoleculePresenter
  ParameterOrder: # was: ComposableParamOrder (dead config)
    active: true
  PreviewNaming:
    active: true
  PreviewPublic:
    active: true
    # You can optionally disable that only previews with @PreviewParameter are flagged
    # previewPublicOnlyIfParams: false
  RememberStateMissing: # was: RememberMissing (dead config; RememberMissing itself was split
    active: true         # into RememberStateMissing + RememberContentMissing in a later release -
                          # only enabling the direct successor here, not both)
  UnstableCollections:
    active: false
  # 11 pre-existing forwarding sites across feature:workspace (RunPanel, WorkspaceConfigurationPanel,
  # WorkspaceScreen) pass a ViewModel down through nested composables rather than hoisting individual
  # state/callbacks. Real, consistent architectural pattern across that module, not a one-off bug -
  # left disabled pending a deliberate decision on whether to refactor to full state hoisting.
  ViewModelForwarding:
    active: false
  ViewModelInjection:
    active: true