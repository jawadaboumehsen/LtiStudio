name: PR Checks

# LtiRomGui includes ../LtiRomServer as a composite build, so both repos are checked out side by side.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rules:
    name: detekt, design-system guardrails, architecture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout LtiRomGui
        uses: actions/checkout@v4
        with:
          path: LtiRomGui

      - name: Checkout LtiRomServer
        uses: actions/checkout@v4
        with:
          repository: jawadaboumehsen/LtiServer
          path: LtiRomServer

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run project rules
        working-directory: LtiRomGui
        run: ./gradlew detekt verifyDesignSystemGuardrails checkArchitecture --no-daemon --console=plain
